# Explicit role registration for local Codex; inherit models from the session.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[features]
multi_agent = true
memories = false

[agents]
max_threads = 3
max_depth = 1

[agents.medusa-specialist]
description = "Medusa 2.21.2 backend implementation: modules, workflows, API, migrations and tests."
config_file = "agents/medusa-specialist.toml"

[agents.nuxt-specialist]
description = "Nuxt 4 / Vue 3 / TypeScript storefront, SSR and Medusa SDK; no React/Next.js."
config_file = "agents/nuxt-specialist.toml"

[agents.backend-reviewer]
description = "Independent backend and harness review: Medusa contracts, auth, workflows, tests and orchestration evidence; read-only."
config_file = "agents/backend-reviewer.toml"

[agents.frontend-reviewer]
description = "Independent Nuxt/Vue storefront review: SSR, SDK, accessibility, UI states and regressions; read-only."
config_file = "agents/frontend-reviewer.toml"

[agents.qa-engineer]
description = "Design and run behavior/failure tests from original requirements; edit only assigned tests, never product code."
config_file = "agents/qa-engineer.toml"

# Project skills are discovered under .agents/skills; explicitly keep this local skill enabled.
[[skills.config]]
path = "../.agents/skills/brainstorming-lite/SKILL.md"
enabled = true
